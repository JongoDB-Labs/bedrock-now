# The browser terminal's direct way out (TERMINAL_EGRESS=host, chosen in Settings › Claude Code; the only way up to
# v0.10.0): the sandbox itself on "terminal-out", a network with the internet — and through it this computer's own
# services (on Docker Desktop, Docker's host address answers for its 127.0.0.1; on Linux, the network's gateway for
# services listening on every address) and your local network, on any port, by any protocol. Added with
# compose.terminal.yaml only when chosen; the default, TERMINAL_EGRESS=internet (compose.terminal-proxy.yaml), reaches
# the internet through an egress proxy that refuses all of those; TERMINAL_EGRESS=off neither.
services:
  terminal:
    networks: [terminal, terminal-out]

networks:
  terminal-out:
