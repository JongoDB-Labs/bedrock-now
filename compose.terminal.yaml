# The optional browser terminal (./stack terminal enable; lib/terminal.sh adds this file to every docker compose call
# while TERMINAL_ENABLED=true in .env). Claude Code runs in a sandbox container, never on your computer: no Docker
# socket, no capabilities, not root, a read-only image, and of your files only the one folder you chose
# (TERMINAL_WORKSPACE, at /workspace). Its home folder (Claude Code's settings and history) is the terminal-home
# volume. The browser reaches it at terminal.PORTAL_HOST through the main Caddy, which first asks the portal for the
# session, a fresh password unlock and the Origin (portal/portal/app.py), then adds the terminal's secret header,
# and through the terminal's gateway, which requires that header and passes the request to ttyd's UNIX socket.
#
# Networks: the terminal shares its internal network "terminal" (no internet) with one peer only, terminal-gateway: a
# second, minimal Caddy that forwards the few LiteLLM and shared-mcp paths Claude Code needs (:8091, as "gateway")
# and nothing else. The gateway's other network, "terminal-link" (internal too), holds only what it talks to:
# LiteLLM, shared-mcp and the main Caddy. The portal, Open WebUI and the databases are on no network with either.
# "terminal-out" (compose.terminal-egress.yaml, unless TERMINAL_EGRESS=off) is the terminal's way out to the internet.
services:
  terminal:
    build:
      context: ./terminal
      args:
        BN_UID: ${TERMINAL_UID:-10104}
        BN_GID: ${TERMINAL_GID:-10104}
    image: ${COMPOSE_PROJECT_NAME:-bedrock-now}/terminal:local   # per project, like portal
    restart: unless-stopped
    hostname: terminal
    user: "${TERMINAL_UID:-10104}:${TERMINAL_GID:-10104}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # /run/bn: Claude Code's managed settings, written by bn-terminal at each start (/etc/claude-code links there)
    tmpfs: ["/tmp:size=1g,mode=1777", "/run/bn:size=64k,mode=0700,uid=${TERMINAL_UID:-10104},gid=${TERMINAL_GID:-10104}"]
    mem_limit: ${TERMINAL_MEM_LIMIT:-4g}
    pids_limit: 1024
    init: true
    environment:
      # Claude Code → LiteLLM through the gateway, with the terminal's own key (claude-code-terminal: its own monthly
      # budget, BUDGET_TERMINAL, revocable on its own), the same model mapping and switches as bin/claude-bedrock:
      # plain `claude` in here uses Bedrock too.
      ANTHROPIC_BASE_URL: http://gateway:8091
      ANTHROPIC_AUTH_TOKEN: ${LITELLM_KEY_TERMINAL:-}
      ANTHROPIC_MODEL: ${CLAUDE_BEDROCK_OPUS_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${CLAUDE_BEDROCK_OPUS_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${CLAUDE_BEDROCK_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${CLAUDE_BEDROCK_HAIKU_MODEL:-}
      CLAUDE_BEDROCK_OPUS_MODEL: ${CLAUDE_BEDROCK_OPUS_MODEL:-}
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"   # Bedrock rejects Anthropic beta headers
      # (no ENABLE_TOOL_SEARCH: tool search needs a beta header, so with the betas off it changes nothing)
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"   # no telemetry, error reports or update checks
      DISABLE_AUTOUPDATER: "1"                        # the image is read-only; ./stack update rebuilds it
      # Claude Code's auto mode in here (Settings › Terminal / Code page › Auto mode): bn-terminal writes the sandbox's
      # managed settings from them at each start (terminal/bin/bn-claude-policy) — a change restarts this container.
      TERMINAL_AUTO_MODE: ${TERMINAL_AUTO_MODE:-false}
      CODE_AUTO_MODE: ${CODE_AUTO_MODE:-false}
      # The shared MCP server (bn-terminal writes ~/.config/bedrock-now/mcp.json from these).
      BN_MCP_URL: http://gateway:8091/mcp
      SHARED_MCP_TOKEN: ${SHARED_MCP_TOKEN:-}
    # Docker Desktop's names for your computer point nowhere in here. A speed bump only: the address behind them stays
    # reachable while the terminal has internet access (TERMINAL_EGRESS=off removes that).
    extra_hosts:   # IPv4 TEST-NET and the IPv6 discard prefix: nothing answers there
      - "host.docker.internal:192.0.2.1"
      - "host.docker.internal:100::1"
      - "gateway.docker.internal:192.0.2.1"
      - "gateway.docker.internal:100::1"
    volumes:
      - terminal-home:/home/claude
      # ttyd's UNIX socket (no TCP listener in here at all), shared only with the gateway
      - terminal-socket:/run/bn-ttyd
      # The Code page's spawn server (bn-coded, started by bn-terminal) listens here; only the code container shares
      # it (compose.code.yaml, read-only: it connects, never listens). Always here, so turning the Code page on or off
      # never recreates this container (and never ends its tmux session); with no code container nothing connects.
      - code-socket:/run/bn-code
      # The Code page's preview proxy (bn-preview, started by bn-terminal) listens here; only the gateway shares it
      # (read-only: it connects). Always here too, for the same reason.
      - preview-socket:/run/bn-preview
      # Never created by Docker: a missing folder stops the container instead of becoming an empty root-owned one.
      - type: bind
        source: ${TERMINAL_WORKSPACE:?run ./stack terminal enable}
        target: /workspace
        bind: { create_host_path: false, selinux: z }
    networks: [terminal]
    depends_on:
      terminal-gateway: { condition: service_started }
    logging:   # (YAML anchors do not reach across compose files: same values as x-logging in compose.yaml)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The terminal's only peer (caddy/terminal-gateway.caddy; the same pinned image as the main Caddy). On "terminal" it
  # is "gateway" (:8091, bound there alone): LiteLLM's /v1/messages(/count_tokens), /v1/models…, /key/info,
  # /model/info and /health/liveliness and shared-mcp's /mcp; 404 for anything else. On "terminal-link" it is
  # "terminal-upstream" (:7681, bound there alone): ttyd's socket, for the main Caddy, only with the secret header; and
  # :7682 there: bn-preview's socket (the Code page's previews), only with the preview's own secret header.
  # It runs as the terminal's user: ttyd's socket is that user's alone (mode 700).
  terminal-gateway:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/terminal-gateway.caddy", "--adapter", "caddyfile"]
    user: "${TERMINAL_UID:-10104}:${TERMINAL_GID:-10104}"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # the image's caddy binary carries this file capability; exec fails without it
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - "/data:uid=${TERMINAL_UID:-10104},gid=${TERMINAL_GID:-10104},mode=0700"
      - "/config:uid=${TERMINAL_UID:-10104},gid=${TERMINAL_GID:-10104},mode=0700"
    mem_limit: 256m
    pids_limit: 200
    environment:
      # Required (X-Bn-Terminal-0<this>) before ttyd and removed on the way; only the main Caddy adds it. In the
      # environment only, never on a command line (those are readable by every user of the machine).
      TERMINAL_PROXY_SECRET: ${TERMINAL_PROXY_SECRET:-}
      # Likewise for the Code page's previews (X-Bn-Preview-0<this>, :7682 → bn-preview): ./stack code enable makes it.
      PREVIEW_PROXY_SECRET: ${PREVIEW_PROXY_SECRET:-}
    # Directory mount, like the main Caddy's (a file replaced by git is seen after a restart).
    volumes:
      - ./caddy:/etc/caddy:ro,z
      - terminal-socket:/run/bn-ttyd:ro   # connecting to the socket needs no write access
      - preview-socket:/run/bn-preview:ro
    networks:
      terminal-link:
        aliases: [terminal-upstream]
      terminal:
        aliases: [gateway]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The main Caddy: the terminal site (caddy/terminal-on.caddy, TERMINAL_HOST), proxied to terminal-upstream:7681.
  caddy:
    networks: [default, terminal-link]
    environment:
      TERMINAL_MODE: "on"   # caddy/terminal-on.caddy (terminal-off.caddy otherwise: no terminal site)
      TERMINAL_HOST: ${TERMINAL_HOST:-terminal.${PORTAL_HOST:-bedrock-now.localhost}}
      TERMINAL_PROXY_SECRET: ${TERMINAL_PROXY_SECRET:-}
      # Remote access to the terminal (REMOTE_TERMINAL=true and ./stack remote): lib/terminal.sh writes this name;
      # blank, the remote site's terminal block matches nothing.
      REMOTE_TERMINAL_HOST: ${REMOTE_TERMINAL_HOST:-terminal.remote.invalid}

  # The portal: the Terminal tab, the unlock, the terminal host's checks and the terminal key's meter on Home.
  portal:
    environment:
      TERMINAL_ENABLED: "true"
      TERMINAL_HOST: ${TERMINAL_HOST:-}
      REMOTE_TERMINAL: ${REMOTE_TERMINAL:-false}
      REMOTE_TERMINAL_HOST: ${REMOTE_TERMINAL_HOST:-}
      LITELLM_KEY_TERMINAL: ${LITELLM_KEY_TERMINAL:-}

  # What the gateway forwards to (its :8091): on terminal-link too, beside their other networks.
  litellm:
    networks: [default, terminal-link]
  shared-mcp:
    networks: [default, terminal-link]

networks:
  terminal:
    internal: true
  terminal-link:
    internal: true

volumes:
  terminal-home:
  terminal-socket:
  code-socket:
  preview-socket:
