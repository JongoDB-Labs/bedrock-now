# bedrock-now stack. All host ports bind to 127.0.0.1. Browsers reach every UI through caddy (the portal);
# only the LiteLLM API and the shared MCP server are published directly, for command-line tools.
# Values come from .env (written by ./stack setup).
# Vars marked :? are created before the first compose call; the :- ones are filled in later setup steps.
name: bedrock-now

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./stack setup}
      POSTGRES_DB: litellm
    # Bind mounts carry ",z" so SELinux hosts (Fedora/RHEL) relabel them; it is a no-op elsewhere.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?run ./stack setup}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?run ./stack setup}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3data:/data
    # No published port: the console is reached through the portal (files.${PORTAL_HOST}).
    logging: *logging

  # One-shot: waits for RustFS, creates buckets idempotently, exits 0.
  rustfs-init:
    image: amazon/aws-cli:2.37.12
    depends_on: [rustfs]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S3="aws --endpoint-url http://rustfs:9000"
        for i in $$(seq 1 60); do $$S3 s3 ls >/dev/null 2>&1 && break; sleep 2; done
        for b in openwebui shared; do
          $$S3 s3api head-bucket --bucket $$b >/dev/null 2>&1 || $$S3 s3 mb s3://$$b
        done
    logging: *logging

  litellm:
    image: ghcr.io/berriai/litellm:1.105.0
    restart: unless-stopped
    # Directory mount (not a single-file mount): setup replaces config.yaml atomically via mv,
    # which a file bind mount would not follow.
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run ./stack setup}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run ./stack setup}
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?run ./stack setup}
      # The portal signs you in to the UI (portal/portal/appsso.py); the UI's own Logout then shows its own form
      # (?sso=off: no automatic sign-in there) rather than reloading into a fresh automatic one.
      PROXY_LOGOUT_URL: /ui/login/?sso=off
      STORE_MODEL_IN_DB: "False"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"   # no runtime price-map fetch; the config carries our prices (lib/prices.sh)
      # An access key from .env, passed only when set (no value here = taken from .env, else left out). Without
      # one (AWS_AUTH=instance-role on EC2) boto3 finds the instance role through IMDS (hop limit 2; docs/cloud-vm.md).
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}   # budget alerts (soft budget at BUDGET_ALERT_PCT, 100%); empty = none
      # Optional; blank = no OpenRouter models are rendered (lib/openrouter.sh).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # LiteLLM sends these to OpenRouter as X-Title / HTTP-Referer, so OpenRouter's Activity and Logs show the
      # requests as "bedrock-now" (not "liteLLM"). They name this project only, nothing about you or this install.
      OR_APP_NAME: bedrock-now
      OR_SITE_URL: https://github.com/JongoDB-Labs/bedrock-now
      # Optional speech-to-text provider key (OpenAI or Groq); blank = no "stt" model is rendered (lib/stt.sh).
      STT_API_KEY: ${STT_API_KEY:-}
    volumes:
      - ./litellm:/app/config:ro,z
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    networks: [default, stt]   # stt: the speech-to-text container's only network (no internet access)
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.0-slim
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?run ./stack setup}
      WEBUI_ADMIN_EMAIL: ${OPENWEBUI_ADMIN_EMAIL:?run ./stack setup}
      WEBUI_ADMIN_PASSWORD: ${OPENWEBUI_ADMIN_PASSWORD:?run ./stack setup}
      WEBUI_ADMIN_NAME: Admin
      ENABLE_SIGNUP: "false"
      ENABLE_PERSISTENT_CONFIG: "false"   # .env always wins over values saved in the DB
      ENABLE_API_KEYS: "true"
      ENABLE_OLLAMA_API: "false"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      VECTOR_DB: pgvector
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET_NAME: openwebui
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_REGION_NAME: us-east-1
      S3_ADDRESSING_STYLE: path
      RAG_EMBEDDING_ENGINE: ${OWUI_EMBED_ENGINE:-openai}   # never the local sentence-transformers default
      ENABLE_WEB_SEARCH: "false"                            # no third-party search APIs
      ENABLE_OPENAI_API: "true"                             # only connection = LiteLLM
      RAG_EMBEDDING_MODEL: ${OWUI_EMBED_MODEL:-}
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      ENABLE_RAG_HYBRID_SEARCH: ${OWUI_HYBRID_SEARCH:-false}
      RAG_RERANKING_ENGINE: ${OWUI_RERANK_ENGINE:-}
      RAG_RERANKING_MODEL: ${OWUI_RERANK_MODEL:-}
      RAG_EXTERNAL_RERANKER_URL: http://litellm:4000/v1/rerank
      RAG_EXTERNAL_RERANKER_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      ENABLE_IMAGE_GENERATION: ${OWUI_ENABLE_IMAGES:-false}
      IMAGE_GENERATION_ENGINE: openai
      IMAGES_OPENAI_API_BASE_URL: http://litellm:4000/v1
      IMAGES_OPENAI_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      IMAGE_GENERATION_MODEL: ${OWUI_IMAGE_MODEL:-}
      # Chat experience (OWUI_* model choices are made by setup from the models your key can use)
      DEFAULT_MODELS: ${OWUI_DEFAULT_MODEL:-}                # default chat model for users without their own
      TASK_MODEL_EXTERNAL: ${OWUI_TASK_MODEL:-}              # titles, tags, follow-ups: a cheap model
      ENABLE_TITLE_GENERATION: "true"
      ENABLE_TAGS_GENERATION: "true"
      ENABLE_FOLLOW_UP_GENERATION: "true"
      # usage: token usage per answer (the cost filter needs it). builtinTools: v0.12 sends the specs of ~40
      # built-in tools (knowledge bases, chat history, notes, calendar, automations, skills, tasks, time…)
      # with EVERY chat request — ~8-10K input tokens for a one-line question. Those categories are off, and
      # so are the 8 memory tools (~2K tokens; the browser turns Memory on in every chat): saved memories still
      # reach the model as context, it just can't edit them itself. Image generation, code interpreter, web
      # search and attached-file tools stay on (each is sent only while the user turns that feature on in the
      # chat). Attachments and #knowledge still use RAG. A model's own Builtin Tools settings (Workspace →
      # Models) override this. README: Costs.
      DEFAULT_MODEL_METADATA: >-
        {"capabilities":{"usage":true},"builtinTools":{"time":false,"user_input":false,"knowledge":false,
        "chats":false,"notes":false,"channels":false,"skills":false,"tasks":false,"automations":false,
        "calendar":false,"notifications":false,"subagents":false,"memory":false}}
      ENABLE_VERSION_UPDATE_CHECK: "false"
      # No changelog popup / update toast; read-aloud uses the browser's system voices. The microphone follows
      # AUDIO_STT_ENGINE (no per-user STT default, so turning server speech-to-text on reaches every user).
      DEFAULT_INTERFACE_SETTINGS: '{"showChangelog":false,"showUpdateToast":false,"audio":{"tts":{"engine":""}}}'
      # Speech-to-text: "web" = the browser's Web Speech API (the slim image has no local Whisper; Call is then
      # unavailable). "openai" (OWUI_STT_ENGINE, set by ./stack setup / ./stack stt) = an OpenAI-compatible server
      # called with Open WebUI's own key, so it counts on that key's budget (lib/stt.sh): the stt container for
      # Bedrock Voxtral, through Caddy's internal :8090 site (OWUI_STT_BASE_URL; Open WebUI shares no network with
      # stt), else LiteLLM's "stt" model (OpenAI or Groq).
      AUDIO_STT_ENGINE: ${OWUI_STT_ENGINE:-web}
      AUDIO_STT_OPENAI_API_BASE_URL: ${OWUI_STT_BASE_URL:-http://litellm:4000/v1}
      AUDIO_STT_OPENAI_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      AUDIO_STT_MODEL: stt
      AUDIO_TTS_ENGINE: ""                                   # "" = browser voices (Call reads answers with them too)
      DEFAULT_PROMPT_SUGGESTIONS: '[{"title":["Summarize a document","attach a file and get the key points"],"content":"Summarize the attached document: the key points first, then anything that needs a decision or follow-up."},{"title":["Explain this code","paste a snippet"],"content":"Explain what this code does, step by step, and point out anything risky or surprising:\n\n"},{"title":["Draft an email","from a few bullet points"],"content":"Draft a short, friendly, professional email from these points:\n- "},{"title":["Compare two options","pros, cons and a recommendation"],"content":"Compare these two options. Give pros and cons of each in a table, then a recommendation with the main reason:\nOption A: \nOption B: "}]'
      ENABLE_COMMUNITY_SHARING: "false"                     # no sharing to openwebui.com
      OFFLINE_MODE: "true"                                  # no Hugging Face downloads, no update check
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      # Login comes from the portal: Caddy deletes any client-sent X-Portal-User and sets it only for a valid
      # portal session. Safe only because Open WebUI publishes no port (reachable through Caddy alone).
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Portal-User
      # Remote access (./stack remote): links built for the remote name (empty = Open WebUI's default). Its cookies
      # stay non-Secure here (the local site is http); Caddy's remote site marks them Secure on the way out.
      WEBUI_URL: ${REMOTE_CHAT_HOST:+https://${REMOTE_CHAT_HOST:-}}
      # Cross-origin requests (and its WebSocket) only from Chat's own origins: CHAT_ORIGIN (./stack writes it like
      # PORTAL_ORIGIN) and the remote chat host. Open WebUI's default, '*', answers any Origin with credentials
      # allowed: a page on the portal's other hosts (the terminal's included) could read your chats. '*' only
      # until ./stack up has written CHAT_ORIGIN.
      CORS_ALLOW_ORIGIN: "${CHAT_ORIGIN:-*}${CHAT_ORIGIN:+${REMOTE_CHAT_HOST:+;https://${REMOTE_CHAT_HOST:-}}}"
    volumes:
      - owui:/app/backend/data
    depends_on:
      postgres: { condition: service_healthy }
      litellm: { condition: service_healthy }
      rustfs-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    logging: *logging

  shared-mcp:
    build: { context: ./shared-mcp, target: runtime }
    image: ${COMPOSE_PROJECT_NAME:-bedrock-now}/shared-mcp:local   # per project: a second copy never clobbers it
    restart: unless-stopped
    environment:
      SHARED_MCP_TOKEN: ${SHARED_MCP_TOKEN:?run ./stack setup}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      SHARED_BUCKET: shared
      OPENWEBUI_URL: http://open-webui:8080
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
    ports:
      - "127.0.0.1:${SHARED_MCP_PORT:-8765}:8000"
    depends_on:
      open-webui: { condition: service_healthy }
      rustfs-init: { condition: service_completed_successfully }
    logging: *logging

  # Bedrock speech-to-text (lib/stt.sh; only with STT_PROVIDER=bedrock: ./stack adds --profile stt). Open WebUI posts
  # recordings here (through Caddy's internal :8090 site); ffmpeg converts them and Mistral Voxtral transcribes
  # them through LiteLLM's Bedrock pass-through with the caller's own key. No AWS credentials, no key of its own,
  # no published port.
  stt:
    build: { context: ./stt, target: runtime }
    image: ${COMPOSE_PROJECT_NAME:-bedrock-now}/stt:local   # per project, like portal
    profiles: ["stt"]
    restart: unless-stopped
    user: "10103:10103"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Uploads and ffmpeg's work files: per request up to 25 MB spooled + 25 MB input + 2.4 MB MP3; three at a time.
    tmpfs: ["/tmp:size=192m,mode=1777"]
    mem_limit: 768m
    pids_limit: 64
    # Only the internal "stt" network, with LiteLLM and Caddy: no internet access, and no way to reach Open WebUI
    # (which trusts X-Portal-User from its peers) or the portal. Open WebUI and the portal reach it through Caddy's
    # internal :8090 site, which strips X-Portal-* — a one-way hop.
    networks: [stt]
    environment:
      LITELLM_URL: http://litellm:4000
      STT_BEDROCK_MODEL: ${STT_BEDROCK_MODEL:-voxtral-small}
    depends_on:
      litellm: { condition: service_healthy }
    logging: *logging

  # Login, Home dashboard, and the auth check Caddy asks before every request (/auth/verify).
  portal:
    build: { context: ./portal, target: runtime }
    image: ${COMPOSE_PROJECT_NAME:-bedrock-now}/portal:local   # per project, like shared-mcp
    restart: unless-stopped
    # User 10102 owns /state (portal-state). Linux: PORTAL_GID (set by ./stack) is your group, so the price
    # update can write litellm/prices/ (setgid, group-writable); macOS needs no group.
    user: "10102:${PORTAL_GID:-10102}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      PORTAL_STATE_DIR: /state
      # Not :? — ./stack update pulls images before setup has created these; the portal refuses to start without them.
      # The hash of PORTAL_PASSWORD (./stack keeps it in step): the portal never holds the password itself.
      PORTAL_PASSWORD_HASH: ${PORTAL_PASSWORD_HASH:-}
      PORTAL_SECRET: ${PORTAL_SECRET:-}
      # Caddy sends it on every request it forwards; without it the portal ignores X-Portal-Remote and
      # Tailscale-User-Login (they could only come from another container talking to portal:8000 directly).
      PORTAL_PROXY_SECRET: ${PORTAL_PROXY_SECRET:-}
      PORTAL_HOST: ${PORTAL_HOST:-bedrock-now.localhost}
      PORTAL_PORT: ${PORTAL_PORT:-80}
      # Where the password lives, for the login page (set by ./stack; blank = the generic wording).
      PORTAL_ENV_FILE: ${BEDROCK_NOW_ENV_DISPLAY:-}
      PORTAL_PROJECT: ${COMPOSE_PROJECT_NAME:-}
      PORTAL_USER_EMAIL: ${OPENWEBUI_ADMIN_EMAIL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_KEY_CLAUDE_CODE: ${LITELLM_KEY_CLAUDE_CODE:-}
      LITELLM_KEY_OPENWEBUI: ${LITELLM_KEY_OPENWEBUI:-}
      LITELLM_KEY_SETUP: ${LITELLM_KEY_SETUP:-}
      LITELLM_UI_USER: ${LITELLM_UI_USER:-admin}   # the admin email once setup created LiteLLM's database admin
      LITELLM_UI_PASSWORD: ${LITELLM_UI_PASSWORD:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      # Settings → Files shows it behind the password (the portal already holds the RustFS root pair it guards).
      SHARED_MCP_TOKEN: ${SHARED_MCP_TOKEN:-}
      CLAUDE_BEDROCK_OPUS_MODEL: ${CLAUDE_BEDROCK_OPUS_MODEL:-}
      CLAUDE_BEDROCK_SONNET_MODEL: ${CLAUDE_BEDROCK_SONNET_MODEL:-}
      CLAUDE_BEDROCK_HAIKU_MODEL: ${CLAUDE_BEDROCK_HAIKU_MODEL:-}
      # Voice on Home: which speech-to-text is on (lib/stt.sh keeps these in step; no key is passed).
      STT_ENGINE: ${OWUI_STT_ENGINE:-web}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_BEDROCK_MODEL: ${STT_BEDROCK_MODEL:-}
      # Optional: Home asks openrouter.ai for the key's usage/credits server-side; never sent to the browser.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # PORTAL_SESSION_DAYS: how long a sign-in lasts; BUDGET_ALERT_PCT: where the budget meters on Home turn amber
      PORTAL_SESSION_DAYS: ${PORTAL_SESSION_DAYS:-30}
      BUDGET_ALERT_PCT: ${BUDGET_ALERT_PCT:-80}
      # Daily price update from public price lists (no credentials); the region picks the regional AWS prices.
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      PRICE_UPDATES: ${PRICE_UPDATES:-true}
      # Daily check for a newer bedrock-now release (GitHub's public releases API; nothing about you is sent).
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      # One-click Update/Rollback/Clean from a remote (non-localhost) browser: off unless set to true.
      REMOTE_ADMIN_ACTIONS: ${REMOTE_ADMIN_ACTIONS:-false}
      # App host names (blank = chat./admin./files.PORTAL_HOST) and the remote site (./stack remote; blank = off).
      CHAT_HOST: ${CHAT_HOST:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
      FILES_HOST: ${FILES_HOST:-}
      REMOTE_MODE: ${REMOTE_MODE:-off}
      REMOTE_HOST: ${REMOTE_HOST:-}
      REMOTE_CHAT_HOST: ${REMOTE_CHAT_HOST:-}
      REMOTE_ADMIN_HOST: ${REMOTE_ADMIN_HOST:-}
      REMOTE_FILES_HOST: ${REMOTE_FILES_HOST:-}
      TAILSCALE_ALLOWED_LOGIN: ${TAILSCALE_ALLOWED_LOGIN:-}
    # Read-only: model check results (probe-results.tsv), the rendered config and the catalog for Home, and
    # .state/status (the installed version, written by ./stack). Writable besides /tmp: portal-state (/state:
    # the logout time, so a restart keeps it), litellm/prices/ (only prices.auto.tsv + prices.meta.json from the
    # daily price update), .state/update-check (only the release check's latest.json + latest.txt) and
    # .state/requests (only req-/act-<nonce>.json and cfg-<nonce>.req files for the optional host helper,
    # lib/helper.sh and lib/settings_helper.sh). No Docker socket, no .env: Settings reads .state/status/settings.json.
    volumes:
      - ./litellm:/data/litellm:ro,z
      - ./litellm/prices:/data/prices:rw,z
      - ./catalog:/data/catalog:ro,z
      - ./.state/status:/data/status:ro,z
      - ./.state/update-check:/data/update-check:rw,z
      - ./.state/requests:/data/requests:rw,z
      - portal-state:/state
    logging: *logging

  # The only way in for browsers: http://${PORTAL_HOST} and its chat./admin./files. subdomains (caddy/Caddyfile).
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    user: "65534:65534"          # unprivileged: listens on 8080 inside the container
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # the image's caddy binary carries this file capability; exec fails without it
    security_opt: ["no-new-privileges:true"]
    # Owned by the unprivileged user: Caddy creates /data/caddy and /config/caddy at start.
    tmpfs: ["/data:uid=65534,gid=65534,mode=0700", "/config:uid=65534,gid=65534,mode=0700"]
    environment:
      PORTAL_HOST: ${PORTAL_HOST:-bedrock-now.localhost}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-http://bedrock-now.localhost}   # written by setup: http://HOST[:PORT]
      CHAT_HOST: ${CHAT_HOST:-chat.${PORTAL_HOST:-bedrock-now.localhost}}
      ADMIN_HOST: ${ADMIN_HOST:-admin.${PORTAL_HOST:-bedrock-now.localhost}}
      FILES_HOST: ${FILES_HOST:-files.${PORTAL_HOST:-bedrock-now.localhost}}
      CADDY_AUTO_HTTPS: "off"   # compose.domain.yaml: disable_redirects (certificates for the remote site)
      # Remote site (caddy/remote-<mode>.caddy; ./stack remote). The .invalid names only keep the file valid
      # while the sidecar has not told us the tailnet's name yet: nothing can match them.
      REMOTE_MODE: ${REMOTE_MODE:-off}
      REMOTE_HOST: ${REMOTE_HOST:-remote.invalid}
      REMOTE_CHAT_HOST: ${REMOTE_CHAT_HOST:-chat.remote.invalid}
      REMOTE_ADMIN_HOST: ${REMOTE_ADMIN_HOST:-admin.remote.invalid}
      REMOTE_FILES_HOST: ${REMOTE_FILES_HOST:-files.remote.invalid}
      REMOTE_ORIGIN: ${REMOTE_ORIGIN:-https://remote.invalid}
      # Only the sidecar's fixed address may use the remote listeners (compose.tailscale.yaml).
      REMOTE_SIDECAR_IP: ${REMOTE_SIDECAR_IP:-10.255.255.254}
      PORTAL_PROXY_SECRET: ${PORTAL_PROXY_SECRET:-}
    depends_on:
      portal: { condition: service_healthy }   # forward_auth needs it; avoids 502s on the first requests
    # Directory mount, so a Caddyfile replaced by git (new inode) is seen after a restart.
    volumes:
      - ./caddy:/etc/caddy:ro,z
    ports:
      - "127.0.0.1:${PORTAL_PORT:-80}:8080"   # only 8080: the internal :8090 site (speech-to-text) is not published
    networks: [default, stt]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/caddy-health"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

networks:
  default:
  # Speech-to-text (lib/stt.sh): internal (no internet access); its members are stt, LiteLLM and Caddy only.
  stt:
    internal: true

volumes:
  pgdata:
  s3data:
  owui:
  portal-state:
