<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code (prototype) · bedrock-now</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <strong>Code</strong> <span class="muted">prototype</span>
  <label>Model <select id="model"><option value="haiku">haiku</option><option value="sonnet">sonnet</option><option value="opus">opus</option></select></label>
  <label>Mode <select id="mode"><option>default</option><option>acceptEdits</option><option>plan</option><option>dontAsk</option></select></label>
  <button id="start" type="button">New session</button>
  <button id="stop" type="button">Stop</button>
  <button id="cmds" type="button">Commands</button>
  <button id="models" type="button">Models</button>
  <button id="mcp" type="button">MCP</button>
  <button id="plugins" type="button">Plugins</button>
  <button id="sessions" type="button">Sessions</button>
  <button id="files" type="button">Files</button>
  <span id="status" class="muted">not connected</span>
</header>
<main>
  <section id="log" aria-live="polite"></section>
  <aside id="side"></aside>
</main>
<div id="perm" hidden>
  <p id="perm-title"></p>
  <pre id="perm-input"></pre>
  <button id="perm-allow" type="button">Allow once</button>
  <button id="perm-always" type="button">Always allow</button>
  <button id="perm-deny" type="button">Deny</button>
</div>
<form id="ask"><textarea id="prompt" rows="3" placeholder="Ask Claude… (/ for commands)"></textarea><button type="submit">Send</button></form>
</body>
</html>
