# PROTOTYPE (code-page spike), applied to an e2e throwaway only by code/proto/try.sh: the code service, its socket
# volume shared with the terminal, and its own internal network with the main Caddy.
services:
  code:
    build: { context: ./code/proto }
    image: ${COMPOSE_PROJECT_NAME:-bedrock-now}/code:proto
    restart: unless-stopped
    user: "${TERMINAL_UID:-10104}:${TERMINAL_GID:-10104}"   # bn-coded's socket is that user's alone (mode 700 dir)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 768m
    pids_limit: 128
    init: true
    environment:
      CODE_PROXY_SECRET: ${CODE_PROXY_SECRET:-}
      CODE_ORIGIN: http://code.${PORTAL_HOST:-bedrock-now.localhost}:${PORTAL_PORT:-80}
    volumes:
      - code-socket:/run/bn-code:ro   # connecting to bn-coded's socket needs no write access
    networks:
      code-link:
        aliases: [code-upstream]
    depends_on:
      terminal: { condition: service_healthy }

  terminal:
    volumes:
      - code-socket:/run/bn-code

  caddy:
    networks: [default, terminal-link, code-link]
    environment:
      CODE_HOST: code.${PORTAL_HOST:-bedrock-now.localhost}
      CODE_PROXY_SECRET: ${CODE_PROXY_SECRET:-}

networks:
  code-link:
    internal: true

volumes:
  code-socket:
