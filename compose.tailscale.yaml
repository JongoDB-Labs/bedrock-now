# Remote access through Tailscale (./stack remote enable tailscale|domain; lib/remote.sh adds this file to every
# docker compose call while REMOTE_MODE is tailscale or domain). Nothing is published on the host: the sidecar
# joins your tailnet over outbound connections (userspace networking: no /dev/net/tun, no capabilities) and
# forwards to Caddy's internal remote listener as described in tailscale/serve.json (written by ./stack).
#
# The sidecar sits alone with Caddy on the small "remote" network. Caddy accepts its remote listeners (8081, 8443)
# only from that subnet and trusts X-Forwarded-* only from it, so no other container can pose as the sidecar.
# Its default, 10.255.255.248/29, lies outside Docker's default address pools (172.17-31.x, 192.168.x), which
# Compose draws the other networks from; REMOTE_SUBNET in .env changes it if it collides with one of yours (a
# /29 is enough: the gateway, Caddy and the sidecar).
services:
  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-bedrock-now-node}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 200
    environment:
      # Used only for the first login: ./stack removes it from .env afterwards and recreates the container, so it
      # is not left in `docker inspect`; the node key then lives in the tailscale-state volume.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-bedrock-now-node}
      # Tailscale Services need a tagged host (https://tailscale.com/kb/1552/tailscale-services).
      TS_EXTRA_ARGS: --advertise-tags=${TS_TAG:-tag:bedrock-now}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      # Directory mount: containerboot watches the directory and applies a rewritten serve.json at once; it
      # advertises the Services listed there on start (TS_EXPERIMENTAL_SERVICE_AUTO_ADVERTISEMENT, default true
      # since v1.96). No health/metrics listener (TS_ENABLE_HEALTH_CHECK / TS_LOCAL_ADDR_PORT stay off).
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro,z
    tmpfs: [/tmp, /var/run/tailscale]
    networks: [remote]
    depends_on: [caddy]
    healthcheck:
      # tailscaled is alive (answers on its socket); whether it is logged in: ./stack remote status
      test: ["CMD", "tailscale", "status", "--json", "--peers=false"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:   # (YAML anchors do not reach across compose files: same values as x-logging in compose.yaml)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    networks: [default, remote]

networks:
  remote:
    ipam:
      config:
        - subnet: ${REMOTE_SUBNET:-10.255.255.248/29}

volumes:
  tailscale-state:
